<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{TITLE}}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='7' width='28' height='18' rx='3' fill='%232f6fdb'/%3E%3Cg fill='%23fff'%3E%3Crect x='6' y='11' width='3' height='3' rx='.5'/%3E%3Crect x='11' y='11' width='3' height='3' rx='.5'/%3E%3Crect x='16' y='11' width='3' height='3' rx='.5'/%3E%3Crect x='21' y='11' width='5' height='3' rx='.5'/%3E%3Crect x='9' y='18' width='14' height='3' rx='.5'/%3E%3C/g%3E%3C/svg%3E">
<script>try { var t = localStorage.getItem("sc-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
<style>/*{{CSS}}*/</style>
</head>
<body>
<header class="topbar">
  <button id="menu-btn" class="icon-btn mobile-only" type="button" data-i18n-title="action.menu" data-i18n-aria-label="action.menu">☰</button>
  <h1 id="title"></h1>
  <div class="search">
    <input id="search" type="search" autocomplete="off" spellcheck="false" data-i18n-placeholder="search.placeholder">
  </div>
  <button id="fav-btn" class="fav-toggle" type="button" aria-pressed="false"><span aria-hidden="true">★</span> <span class="label" data-i18n="filter.favorites"></span> <span id="fav-count" class="n"></span></button>
  <button id="add-btn" class="primary edit-only" type="button"><span aria-hidden="true">+</span> <span class="label" data-i18n="action.add"></span></button>
  <select id="lang" data-i18n-title="language" data-i18n-aria-label="language"></select>
  <button id="theme-btn" class="icon-btn" type="button"></button>
</header>

<div class="layout">
  <aside id="sidebar">
    <nav id="tree" aria-label="folders"></nav>
    <button id="new-folder" class="ghost edit-only" type="button"></button>
    <h2 data-i18n="tree.tags"></h2>
    <div id="tags"></div>
    <div class="side-foot">
      <p class="read-only-note" data-i18n="status.readOnly"></p>
      <p class="keys" data-i18n="help.keys"></p>
      <p id="build-info" class="build-info"></p>
    </div>
  </aside>
  <div id="scrim" class="mobile-only"></div>

  <main>
    <div id="filters" class="filters" hidden></div>
    <div class="crumbs-row">
      <div id="crumbs"></div>
      <span id="count"></span>
    </div>
    <div id="list"></div>
  </main>
</div>

<dialog id="editor">
  <form id="editor-form" method="dialog" novalidate>
    <h2 id="editor-title"></h2>
    <div class="field">
      <span class="field-label" data-i18n="field.keys"></span>
      <div id="keys-list" class="keys-list"></div>
      <div class="row">
        <button id="add-combo" class="ghost small" type="button" data-i18n="field.addAlternative"></button>
      </div>
      <small class="hint" data-i18n="field.keysHint"></small>
      <small id="keys-note" class="note"></small>
    </div>
    <label><span data-i18n="field.action"></span><input name="what" autocomplete="off"></label>
    <label><span data-i18n="field.description"></span><textarea name="description" rows="2"></textarea></label>
    <label><span data-i18n="field.folder"></span><input name="folder" list="folder-list" autocomplete="off">
      <small class="hint" data-i18n="field.folderHint"></small>
    </label>
    <datalist id="folder-list"></datalist>
    <div class="row two">
      <label><span data-i18n="field.version"></span><input name="version" autocomplete="off">
        <small id="version-hint" class="hint"></small>
      </label>
      <label class="check"><input name="favorite" type="checkbox"> <span>★ <span data-i18n="field.favorite"></span></span></label>
    </div>
    <label><span data-i18n="field.tags"></span><input name="tags" autocomplete="off">
      <small class="hint" data-i18n="field.tagsHint"></small>
      <div id="tag-suggest" class="tag-suggest"></div>
    </label>
    <p id="editor-error" class="error" role="alert"></p>
    <div class="actions">
      <button id="editor-delete" class="danger" type="button" data-i18n="action.delete"></button>
      <span class="spacer"></span>
      <button id="editor-cancel" class="ghost" type="button" data-i18n="action.cancel"></button>
      <button class="primary" type="submit" data-i18n="action.save"></button>
    </div>
  </form>
</dialog>

<dialog id="ask">
  <form id="ask-form" method="dialog">
    <p id="ask-message"></p>
    <input id="ask-input" name="value" autocomplete="off">
    <div class="actions">
      <span class="spacer"></span>
      <button id="ask-cancel" class="ghost" type="button" data-i18n="action.cancel"></button>
      <button id="ask-ok" class="primary" type="submit"></button>
    </div>
  </form>
</dialog>

<div id="toast" role="status" aria-live="polite"></div>

<script>/*{{DATA}}*/</script>
<script>/*{{SCRIPTS}}*/</script>
</body>
</html>
